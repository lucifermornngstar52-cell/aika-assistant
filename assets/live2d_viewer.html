<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent !important;
    overflow:hidden;
  }
  #canvas { width:100%; height:100%; display:block; background:transparent; }
  #log {
    position:fixed; top:4px; left:4px; right:4px;
    color:#0ff; font-family:monospace; font-size:10px;
    pointer-events:none;
    text-shadow:0 0 4px #000;
    white-space:pre-wrap;
    z-index:999;
    background:rgba(0,0,0,0.5);
    border-radius:4px;
    padding:2px 4px;
    max-height:120px;
    overflow:hidden;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="log">Init...</div>
<script>
// ─── Logger ───────────────────────────────────────────────────────────────────
const logEl = document.getElementById('log');
const logLines = [];
function log(msg) {
  const ts = new Date().toISOString().substr(11,8);
  logLines.push('['+ts+'] '+msg);
  if (logLines.length > 10) logLines.shift();
  logEl.textContent = logLines.join('\n');
  console.log('[L2D] '+msg);
}
function hideLog() { setTimeout(()=>{ logEl.style.display='none'; }, 6000); }
function showLog() { logEl.style.display='block'; }

// ─── Base path ────────────────────────────────────────────────────────────────
const BASE = (function(){
  const href = window.location.href;
  return href.substring(0, href.lastIndexOf('/')+1);
})();

// ─── State ───────────────────────────────────────────────────────────────────
let app = null;
let model = null;
let currentState = 'idle';
// Реальные группы моций из model3.json — заполняются после загрузки
let modelMotionGroups = [];
let modelExpressions = [];
let modelId = 'hiyori'; // hiyori / haru / natori / ren

// ─── Motion маппинг по состоянию ─────────────────────────────────────────────
// Используем только группы которые реально есть в модели.
// Fallback: если группы нет — берём случайную из Idle.
function getMotionForState(state) {
  // Карта желаемых групп для каждого состояния (приоритет по порядку)
  const want = {
    'idle':      ['Idle'],
    'listening': ['Idle'],
    'thinking':  ['Idle'],
    'talking':   ['TapBody', 'Idle'],
    'greeting':  ['TapBody', 'Idle'],
    'dance':     ['TapBody', 'Idle'],
    'sad':       ['Idle'],
    'happy':     ['TapBody', 'Idle'],
    'excited':   ['TapBody', 'Idle'],
  };
  const groups = want[state] || ['Idle'];
  // Возвращаем первую группу которая реально есть в модели
  for (const g of groups) {
    if (modelMotionGroups.includes(g)) return g;
  }
  // Абсолютный fallback — первая доступная группа
  return modelMotionGroups[0] || null;
}

// Индекс motion внутри группы по состоянию
function getMotionIndex(state, groupSize) {
  // Для idle — случайный чтобы не повторялся
  if (state === 'idle' || state === 'sad' || state === 'listening' || state === 'thinking') {
    return Math.floor(Math.random() * groupSize);
  }
  return 0; // для активных анимаций — первый
}

// Экспрессия (только у Haru — F01..F08)
function getExpressionForState(state) {
  if (modelExpressions.length === 0) return null;
  switch(state) {
    case 'happy':    case 'greeting': case 'excited': return 0; // F01 — happy
    case 'thinking':                                   return 3; // F04 — thinking
    case 'sad':                                        return 4; // F05 — sad
    case 'listening':                                  return 1; // F02 — curious
    default: return null; // не меняем
  }
}

// ─── loadScript ───────────────────────────────────────────────────────────────
function loadScript(src) {
  return new Promise((resolve, reject) => {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Load failed: '+src.split('/').pop()));
    document.head.appendChild(s);
  });
}

// ─── Fit model to canvas ─────────────────────────────────────────────────────
function fitModel() {
  if (!model || !app) return;
  try {
    const sw = app.screen.width;
    const sh = app.screen.height;
    model.x = sw * 0.5;
    model.y = sh * 0.62;
    const origW = (model.internalModel && model.internalModel.originalWidth) || 1000;
    const origH = (model.internalModel && model.internalModel.originalHeight) || 1000;
    const scale = Math.min(sw/origW, sh/origH) * 1.25;
    model.scale.set(scale);
    log('fit: '+sw+'x'+sh+' scale='+scale.toFixed(2));
  } catch(e) { log('fitModel err: '+e.message); }
}

// ─── Определяем группы моций из загруженной модели ───────────────────────────
function detectModelGroups(m) {
  try {
    const settings = m.internalModel && m.internalModel.settings;
    if (settings && settings.motions) {
      modelMotionGroups = Object.keys(settings.motions);
      log('Motion groups: '+modelMotionGroups.join(', '));
    } else {
      // Пробуем через motion manager
      modelMotionGroups = ['Idle', 'TapBody'];
    }
    // Экспрессии
    if (settings && settings.expressions) {
      modelExpressions = settings.expressions.map((e,i) => i);
      log('Expressions: '+modelExpressions.length);
    } else {
      modelExpressions = [];
    }
  } catch(e) {
    modelMotionGroups = ['Idle', 'TapBody'];
    modelExpressions = [];
    log('detectGroups fallback: '+e.message);
  }
}

// ─── Загрузка модели ─────────────────────────────────────────────────────────
async function loadModelFromPath(path) {
  log('Loading: '+path.split('/').slice(-3).join('/'));
  if (model) {
    try { app.stage.removeChild(model); model.destroy(); } catch(e){}
    model = null;
  }
  modelMotionGroups = [];
  modelExpressions = [];

  try {
    model = await PIXI.live2d.Live2DModel.from(path, {
      autoInteract: false,
      autoUpdate:   true,
    });
    app.stage.addChild(model);
    model.anchor.set(0.5, 0.5);
    fitModel();

    window.removeEventListener('resize', fitModel);
    window.addEventListener('resize', fitModel);

    // Определяем доступные группы моций
    detectModelGroups(model);

    // Idle анимация
    _playMotion('idle');

    // Tap handler
    model.interactive = true;
    model.on('pointerdown', () => {
      _playMotion('greeting');
      try { window.flutter_inappwebview.callHandler('FlutterChannel', 'tap'); } catch(e){}
    });

    log('Model ready ✓');
    hideLog();
    try { window.flutter_inappwebview.callHandler('FlutterChannel', 'modelLoaded'); } catch(e){}
    window.setAikaState(currentState);

  } catch(e) {
    log('loadModel ERR: '+(e.message||String(e)));
    console.error('[L2D]', e);
  }
}

// ─── Внутренняя функция воспроизведения ──────────────────────────────────────
function _playMotion(state) {
  if (!model) return;
  try {
    const group = getMotionForState(state);
    if (!group) return;

    // Получаем размер группы
    let groupSize = 1;
    try {
      const settings = model.internalModel.settings;
      groupSize = (settings.motions[group] || []).length || 1;
    } catch(e) {}

    const idx = getMotionIndex(state, groupSize);
    const priority = (state === 'idle' || state === 'sad')
      ? PIXI.live2d.MotionPriority.IDLE
      : PIXI.live2d.MotionPriority.NORMAL;

    model.motion(group, idx, priority);

    // Экспрессия (Haru)
    const expIdx = getExpressionForState(state);
    if (expIdx !== null && modelExpressions.length > expIdx) {
      try { model.expression(expIdx); } catch(e){}
    }

    log('▶ '+state+' → '+group+'['+idx+']'+(expIdx!==null?' expr='+expIdx:''));
  } catch(e) {
    log('motion ERR '+state+': '+e.message);
  }
}

// ─── Инициализация PIXI ───────────────────────────────────────────────────────
async function initLive2D() {
  try {
    await loadScript(BASE+'live2d/live2dcubismcore.min.js');
    log('CubismCore OK');

    // PIXI UMD fix
    var _mod = window.module, _exp = window.exports;
    window.module = undefined; window.exports = undefined;
    await loadScript(BASE+'live2d/pixi.min.js');
    log('PIXI '+(window.PIXI ? PIXI.VERSION : 'NOT FOUND'));
    if (!window.PIXI) { window.module=_mod; window.exports=_exp; throw new Error('PIXI missing'); }

    await loadScript(BASE+'live2d/pixi-live2d-display.min.js');
    window.module = _mod; window.exports = _exp;

    if (!window.PIXI || !PIXI.live2d || !PIXI.live2d.Live2DModel) {
      throw new Error('PIXI.live2d missing');
    }
    log('pixi-live2d OK');

    app = new PIXI.Application({
      view: document.getElementById('canvas'),
      autoStart: true,
      backgroundAlpha: 0,
      transparent: true,
      resizeTo: window,
      antialias: true,
      resolution: window.devicePixelRatio || 1,
    });

    try { PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker); } catch(e){}

    // Загружаем Hiyori по умолчанию
    await loadModelFromPath(BASE+'models/Hiyori/Hiyori.model3.json');

  } catch(e) {
    log('INIT ERR: '+(e.message||String(e)));
    console.error('[L2D] init failed', e);
  }
}

// ─── Flutter API ─────────────────────────────────────────────────────────────

window.setAikaState = function(state) {
  currentState = state || 'idle';
  showLog();
  _playMotion(currentState);
  hideLog();
};

window.loadCustomModel = async function(url) {
  if (!app) { log('app not ready'); return; }
  await loadModelFromPath(url);
};

window.switchBuiltinModel = async function(assetPath) {
  if (!app) { log('app not ready'); return; }
  // Определяем modelId из пути
  if (assetPath.includes('Haru')) modelId='haru';
  else if (assetPath.includes('Natori')) modelId='natori';
  else if (assetPath.includes('Ren')) modelId='ren';
  else modelId='hiyori';
  log('Switch → '+modelId);
  await loadModelFromPath(BASE+assetPath);
};

// ─── Старт ───────────────────────────────────────────────────────────────────
setTimeout(initLive2D, 400);
</script>
</body>
</html>
