<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; background:transparent; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
'use strict';

var BASE = (function() {
  var h = window.location.href;
  return h.substring(0, h.lastIndexOf('/') + 1);
})();

var app = null, model = null, currentState = 'idle';
var motionGroups = [], expressions = [], idleTimer = null, danceTimer = null;

// ── Уведомление Flutter ──────────────────────────────────────────────────────
function notifyFlutter(msg) {
  try {
    window.flutter_inappwebview.callHandler('FlutterChannel', msg);
  } catch(e) {}
}

// ── Web Audio разблокировка ──────────────────────────────────────────────────
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(function(){});
  }
}
document.addEventListener('touchstart', ensureAudio, { once: true });
document.addEventListener('pointerdown', ensureAudio, { once: true });

// ── Звуки ────────────────────────────────────────────────────────────────────
var currentAudio = null;

function playSound(soundPath) {
  if (!soundPath) return;
  ensureAudio();
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; }
    var url = soundPath.startsWith('http') ? soundPath : (BASE + soundPath);
    currentAudio = new Audio(url);
    currentAudio.volume = 0.85;
    currentAudio.play().catch(function(e) {});
  } catch(e) {}
}

function stopSound() {
  if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; currentAudio = null; }
}

function getSoundForMotion(groupName, idx) {
  try {
    var motions = model.internalModel.settings.motions[groupName];
    if (motions && motions[idx] && motions[idx].Sound) {
      return motions[idx].Sound;
    }
  } catch(e) {}
  return null;
}

// ── Маппинг состояний ────────────────────────────────────────────────────────
var STATE_CONFIG = {
  idle:         { group: 'Idle',    exprIdx: -1, autoReset: false },
  listening:    { group: 'Idle',    exprIdx: 2,  autoReset: false },
  thinking:     { group: 'Idle',    exprIdx: 1,  autoReset: false },
  talking:      { group: 'TapBody', exprIdx: 0,  autoReset: false },
  greeting:     { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 4000 },
  dance:        { group: 'TapBody', exprIdx: 0,  autoReset: false },
  notification: { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 5000 },
  alarm:        { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 5000 },
  music:        { group: 'TapBody', exprIdx: 0,  autoReset: false },
  vk:           { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 4000 },
  youtube:      { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 4000 },
  telegram:     { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 4000 },
  happy:        { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 4000 },
  sad:          { group: 'Idle',    exprIdx: 3,  autoReset: true,  resetAfter: 5000 },
  surprised:    { group: 'TapBody', exprIdx: 0,  autoReset: true,  resetAfter: 3000 },
  stretch:      { group: 'Idle',    exprIdx: -1, autoReset: true,  resetAfter: 6000 },
};

function playMotion(state) {
  if (!model) return;
  clearTimeout(idleTimer);
  clearInterval(danceTimer);

  var cfg = STATE_CONFIG[state] || STATE_CONFIG['idle'];

  if (state === 'dance' || state === 'music') {
    var di = 0;
    var doPlay = function() {
      if (!model || (currentState !== 'dance' && currentState !== 'music')) return;
      var group = (motionGroups.indexOf('TapBody') >= 0) ? 'TapBody' : (motionGroups[0] || 'Idle');
      var sz = 1;
      try { sz = (model.internalModel.settings.motions[group] || []).length || 1; } catch(e) {}
      var i = di % sz;
      model.motion(group, i, PIXI.live2d.MotionPriority.NORMAL);
      di++;
      danceTimer = setTimeout(doPlay, 2800);
    };
    doPlay();
    if (cfg.exprIdx >= 0 && cfg.exprIdx < expressions.length) {
      try { model.expression(cfg.exprIdx); } catch(e) {}
    }
    return;
  }

  var groupName = cfg.group;
  if (motionGroups.indexOf(groupName) < 0) groupName = motionGroups[0] || 'Idle';

  var sz = 1;
  try { sz = (model.internalModel.settings.motions[groupName] || []).length || 1; } catch(e) {}

  var idx = (state === 'idle' || state === 'listening')
    ? Math.floor(Math.random() * sz)
    : 0;

  var priority = (state === 'idle')
    ? PIXI.live2d.MotionPriority.IDLE
    : PIXI.live2d.MotionPriority.NORMAL;

  try { model.motion(groupName, idx, priority); } catch(e) {}

  // Звук из motion3.json
  if (cfg.playSound) {
    var snd = getSoundForMotion(groupName, idx);
    if (snd) playSound(snd);
  }

  if (cfg.exprIdx >= 0 && cfg.exprIdx < expressions.length) {
    try { model.expression(cfg.exprIdx); } catch(e) {}
  }

  if (cfg.autoReset) {
    idleTimer = setTimeout(function() {
      stopSound();
      currentState = 'idle';
      playMotion('idle');
    }, cfg.resetAfter || 4000);
  }
}

function fitModel() {
  if (!model || !app) return;
  try {
    var w = app.screen.width, h = app.screen.height;
    model.x = w * 0.5;
    model.y = h * 0.6;
    var origW = (model.internalModel && model.internalModel.originalWidth)  || 1000;
    var origH = (model.internalModel && model.internalModel.originalHeight) || 1000;
    var scale = Math.min(w / origW, h / origH) * 1.35;
    model.scale.set(scale);
  } catch(e) {}
}

function detectGroups(m) {
  motionGroups = []; expressions = [];
  try {
    var s = m.internalModel && m.internalModel.settings;
    if (s && s.motions)     motionGroups = Object.keys(s.motions);
    if (s && s.expressions) expressions  = s.expressions.map(function(_,i){ return i; });
  } catch(e) { motionGroups = ['Idle','TapBody']; }
}

function loadModelFromPath(path) {
  stopSound();
  if (model) {
    try { app.stage.removeChild(model); model.destroy(); } catch(e) {}
    model = null; motionGroups = []; expressions = [];
  }
  return PIXI.live2d.Live2DModel.from(path, { autoInteract: false, autoUpdate: true })
    .then(function(m) {
      model = m;
      app.stage.addChild(model);
      model.anchor.set(0.5, 0.5);
      fitModel();
      window.removeEventListener('resize', fitModel);
      window.addEventListener('resize', fitModel);
      detectGroups(model);
      model.interactive = true;
      model.on('pointerdown', function() {
        ensureAudio();
        window.setAikaState('greeting');
      });
      playMotion('idle');
      // Сообщаем Flutter что модель загружена
      notifyFlutter('modelLoaded');
    })
    .catch(function(e) {
      notifyFlutter('modelError');
    });
}

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function() { reject(new Error('fail: ' + src)); };
    document.head.appendChild(s);
  });
}

function initLive2D() {
  var _mod = window.module, _exp = window.exports;
  window.module = undefined; window.exports = undefined;

  loadScript(BASE + 'live2d/live2dcubismcore.min.js')
    .then(function() { return loadScript(BASE + 'live2d/pixi.min.js'); })
    .then(function() {
      if (!window.PIXI) throw new Error('no PIXI');
      return loadScript(BASE + 'live2d/pixi-live2d-display.min.js');
    })
    .then(function() {
      window.module = _mod; window.exports = _exp;
      if (!PIXI.live2d || !PIXI.live2d.Live2DModel) throw new Error('no live2d');
      app = new PIXI.Application({
        view: document.getElementById('canvas'),
        autoStart: true,
        backgroundAlpha: 0,
        transparent: true,
        resizeTo: window,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
      });
      try { PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker); } catch(e) {}
      // Загружаем дефолтную модель — Flutter потом переключит через switchBuiltinModel
      return loadModelFromPath(BASE + 'models/Natori/Natori.model3.json');
    })
    .catch(function(e) {
      window.module = _mod; window.exports = _exp;
      notifyFlutter('modelError');
    });
}

// ── Public API ────────────────────────────────────────────────────────────────
window.setAikaState = function(state) {
  currentState = state || 'idle';
  if (model) playMotion(currentState);
};
window.loadCustomModel = function(url) {
  if (app) return loadModelFromPath(url);
};
window.switchBuiltinModel = function(p) {
  if (app) return loadModelFromPath(BASE + p);
};
window.switchModel = window.switchBuiltinModel;

window.playNotification = function() { window.setAikaState('notification'); };
window.playGreeting     = function() { window.setAikaState('greeting'); };
window.playDance        = function() { window.setAikaState('dance'); };
window.playMusic        = function() { window.setAikaState('music'); };
window.playAlarm        = function() { window.setAikaState('alarm'); };
window.playSurprised    = function() { window.setAikaState('surprised'); };
window.externalPlaySound = function(path) { playSound(path); };
window.externalStopSound = function() { stopSound(); };

// Запуск — без задержки, сразу как DOM готов
initLive2D();
</script>
</body>
</html>
