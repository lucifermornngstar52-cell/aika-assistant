<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:transparent !important;
    overflow:hidden;
  }
  canvas { display:block; width:100%; height:100%; background:transparent; }
  #log {
    position:fixed; bottom:4px; left:4px; right:4px;
    color:rgba(0,255,255,0.85); font:10px monospace;
    pointer-events:none; white-space:pre-wrap; z-index:9999;
    text-shadow:0 0 3px #000;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="log"></div>
<script>
'use strict';

// ─── Logger ──────────────────────────────────────────────────────────────────
var logEl = document.getElementById('log');
var _lines = [];
function log(m) {
  _lines.push(m);
  if (_lines.length > 8) _lines.shift();
  logEl.textContent = _lines.join('\n');
  console.log('[L2D] ' + m);
}
function hideLog() { setTimeout(function(){ logEl.style.display='none'; }, 5000); }

// ─── Base URL (работает и в Flutter WebView и в Android WebView) ─────────────
var BASE = (function() {
  var h = window.location.href;
  var b = h.substring(0, h.lastIndexOf('/') + 1);
  log('base: ' + b);
  return b;
})();

// ─── Состояние ───────────────────────────────────────────────────────────────
var app = null, model = null, currentState = 'idle';
var motionGroups = [], expressions = [], idleTimer = null;

// ─── Маппинг состояний ───────────────────────────────────────────────────────
function getMotionGroup(state) {
  var want = {
    'idle':      ['Idle'],
    'listening': ['Idle'],
    'thinking':  ['Idle'],
    'talking':   ['TapBody', 'Idle'],
    'greeting':  ['TapBody', 'Idle'],
    'dance':     ['TapBody', 'Idle'],
    'sad':       ['Idle'],
    'happy':     ['TapBody', 'Idle'],
    'stretch':   ['TapBody', 'Idle'],
    'excited':   ['TapBody', 'Idle'],
  };
  var list = want[state] || ['Idle'];
  for (var i = 0; i < list.length; i++) {
    if (motionGroups.indexOf(list[i]) >= 0) return list[i];
  }
  return motionGroups[0] || null;
}

function getExpression(state) {
  if (!expressions.length) return null;
  var map = { happy:0, greeting:0, excited:0, thinking:3, sad:4, listening:1 };
  var idx = map[state];
  return (idx !== undefined && idx < expressions.length) ? idx : null;
}

// ─── Загрузка скриптов ───────────────────────────────────────────────────────
function loadScript(src) {
  return new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = function() { reject(new Error('Cannot load: ' + src.split('/').pop())); };
    document.head.appendChild(s);
  });
}

// ─── Подгон размера модели ───────────────────────────────────────────────────
function fitModel() {
  if (!model || !app) return;
  try {
    var w = app.screen.width, h = app.screen.height;
    model.x = w * 0.5;
    model.y = h * 0.60;
    var origW = (model.internalModel && model.internalModel.originalWidth)  || 1000;
    var origH = (model.internalModel && model.internalModel.originalHeight) || 1000;
    var scale = Math.min(w / origW, h / origH) * 1.3;
    model.scale.set(scale);
  } catch(e) { log('fit err: ' + e.message); }
}

// ─── Определяем groups/expressions из загруженной модели ────────────────────
function detectGroups(m) {
  motionGroups = [];
  expressions  = [];
  try {
    var s = m.internalModel && m.internalModel.settings;
    if (s && s.motions)     motionGroups = Object.keys(s.motions);
    if (s && s.expressions) expressions  = s.expressions.map(function(_,i){ return i; });
    log('groups: ' + motionGroups.join(', '));
    log('expr: ' + expressions.length);
  } catch(e) {
    motionGroups = ['Idle', 'TapBody'];
    log('detectGroups fallback');
  }
}

// ─── Воспроизведение анимации ────────────────────────────────────────────────
function playMotion(state) {
  if (!model) return;
  clearTimeout(idleTimer);
  try {
    var group = getMotionGroup(state);
    if (!group) { log('no group for ' + state); return; }

    var groupSize = 1;
    try {
      var s = model.internalModel.settings;
      groupSize = (s.motions[group] || []).length || 1;
    } catch(e) {}

    var idx = (state === 'idle' || state === 'sad' || state === 'listening' || state === 'thinking')
      ? Math.floor(Math.random() * groupSize) : 0;

    var priority = (state === 'idle' || state === 'sad')
      ? PIXI.live2d.MotionPriority.IDLE
      : PIXI.live2d.MotionPriority.NORMAL;

    model.motion(group, idx, priority);
    log('\u25b6 ' + state + ' \u2192 ' + group + '[' + idx + ']');

    // Экспрессия (только у Haru)
    var expIdx = getExpression(state);
    if (expIdx !== null) {
      try { model.expression(expIdx); } catch(e) {}
    }

    // После активной анимации — вернуть idle
    if (state !== 'idle' && state !== 'sad' && state !== 'listening') {
      idleTimer = setTimeout(function() { playMotion('idle'); }, 4000);
    }

  } catch(e) { log('motion err: ' + e.message); }
}

// ─── Загрузка модели ─────────────────────────────────────────────────────────
function loadModelFromPath(path) {
  log('load: ' + path.split('/').slice(-3).join('/'));
  if (model) {
    try { app.stage.removeChild(model); model.destroy(); } catch(e) {}
    model = null; motionGroups = []; expressions = [];
  }
  return PIXI.live2d.Live2DModel.from(path, {
    autoInteract: false,
    autoUpdate:   true,
  }).then(function(m) {
    model = m;
    app.stage.addChild(model);
    model.anchor.set(0.5, 0.5);
    fitModel();
    window.removeEventListener('resize', fitModel);
    window.addEventListener('resize', fitModel);
    detectGroups(model);

    // Интерактивность
    model.interactive = true;
    model.on('pointerdown', function() {
      playMotion('greeting');
      // Сигнал Flutter (если используется InAppWebView)
      try { window.flutter_inappwebview.callHandler('FlutterChannel', 'tap'); } catch(e) {}
      // Сигнал Android WebView
      try { AndroidBridge.onTap(); } catch(e) {}
    });

    // Ставим idle
    playMotion('idle');
    log('Model ready \u2713');
    hideLog();

    // Сигналим что модель готова
    try { window.flutter_inappwebview.callHandler('FlutterChannel', 'modelLoaded'); } catch(e) {}
    try { AndroidBridge.onModelLoaded(); } catch(e) {}

    // Применяем текущее состояние
    window.setAikaState(currentState);

  }).catch(function(e) {
    log('loadModel ERR: ' + (e.message || String(e)));
    console.error('[L2D] load error', e);
  });
}

// ─── Инициализация ───────────────────────────────────────────────────────────
function initLive2D() {
  log('init...');

  // PIXI UMD fix — убираем module/exports чтобы PIXI загрузился как глобал
  var _mod = window.module, _exp = window.exports;
  window.module = undefined; window.exports = undefined;

  loadScript(BASE + 'live2d/live2dcubismcore.min.js')
  .then(function() {
    log('CubismCore OK');
    return loadScript(BASE + 'live2d/pixi.min.js');
  })
  .then(function() {
    log('PIXI ' + (window.PIXI ? PIXI.VERSION : 'NOT FOUND'));
    if (!window.PIXI) throw new Error('PIXI not loaded');
    return loadScript(BASE + 'live2d/pixi-live2d-display.min.js');
  })
  .then(function() {
    // Восстанавливаем module/exports
    window.module = _mod; window.exports = _exp;
    if (!window.PIXI || !PIXI.live2d || !PIXI.live2d.Live2DModel) {
      throw new Error('PIXI.live2d not found');
    }
    log('pixi-live2d OK');

    app = new PIXI.Application({
      view: document.getElementById('canvas'),
      autoStart: true,
      backgroundAlpha: 0,
      transparent: true,
      resizeTo: window,
      antialias: true,
      resolution: window.devicePixelRatio || 1,
    });

    try { PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker); } catch(e) {}

    // Загружаем Hiyori по умолчанию
    return loadModelFromPath(BASE + 'models/Hiyori/Hiyori.model3.json');
  })
  .catch(function(e) {
    log('INIT ERR: ' + (e.message || String(e)));
    window.module = _mod; window.exports = _exp;
  });
}

// ─── Публичный API для Flutter/Android ──────────────────────────────────────
window.setAikaState = function(state) {
  currentState = state || 'idle';
  playMotion(currentState);
};

window.loadCustomModel = function(url) {
  if (!app) { log('app not ready'); return; }
  return loadModelFromPath(url);
};

window.switchBuiltinModel = function(assetPath) {
  if (!app) { log('app not ready'); return; }
  return loadModelFromPath(BASE + assetPath);
};

// ─── Запуск ──────────────────────────────────────────────────────────────────
// Небольшая задержка для полной инициализации WebView
setTimeout(initLive2D, 300);
</script>
</body>
</html>
