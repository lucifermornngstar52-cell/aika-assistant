<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; }
  model-viewer {
    width:100%; height:100%;
    background-color: transparent;
    --progress-bar-color: transparent;
    --progress-mask: transparent;
  }
  #glow {
    position:fixed; inset:0; pointer-events:none;
    border-radius:50%;
    transition: box-shadow 0.4s ease;
  }
</style>
</head>
<body>
<div id="glow"></div>
<model-viewer
  id="mv"
  src="./models/aika_model.glb"
  autoplay
  animation-name="idle"
  camera-controls
  disable-zoom
  disable-pan
  touch-action="none"
  style="width:100%;height:100%;background:transparent"
  interaction-prompt="none"
></model-viewer>

<script>
var mv = document.getElementById('mv');
var glow = document.getElementById('glow');
var currentState = 'idle';
var danceTimer = null;

// Маппинг состояний → анимации GLB
var ANIM_MAP = {
  idle:         'idle',
  listening:    'idle',
  thinking:     'sneak_pose',
  talking:      'agree',
  greeting:     'walk',
  dance:        'SambaDance',
  music:        'SambaDance',
  notification: 'agree',
  alarm:        'run',
  vk:           'walk',
  youtube:      'walk',
  telegram:     'walk',
  happy:        'agree',
  sad:          'sad_pose',
  surprised:    'agree',
  stretch:      'sad_pose',
};

// Цвет свечения по состоянию
var GLOW_MAP = {
  idle:         '0 0 18px 4px rgba(0,176,255,0.25)',
  listening:    '0 0 28px 8px rgba(0,176,255,0.55)',
  thinking:     '0 0 22px 6px rgba(206,147,216,0.5)',
  talking:      '0 0 28px 8px rgba(0,230,118,0.5)',
  greeting:     '0 0 28px 8px rgba(0,230,118,0.5)',
  dance:        '0 0 32px 10px rgba(255,64,129,0.6)',
  music:        '0 0 32px 10px rgba(255,64,129,0.6)',
  notification: '0 0 26px 8px rgba(255,215,64,0.55)',
  alarm:        '0 0 30px 10px rgba(255,82,82,0.6)',
  sad:          '0 0 18px 5px rgba(120,144,156,0.4)',
  happy:        '0 0 28px 8px rgba(0,230,118,0.5)',
};

function getAnim(state) {
  return ANIM_MAP[state] || 'idle';
}

function setGlow(state) {
  glow.style.boxShadow = GLOW_MAP[state] || GLOW_MAP['idle'];
}

function playState(state) {
  if (!mv) return;
  currentState = state;
  clearTimeout(danceTimer);

  var animName = getAnim(state);
  try {
    mv.animationName = animName;
    mv.play({ repetitions: Infinity });
  } catch(e) {}

  setGlow(state);

  // Авто-сброс к idle для одноразовых реакций
  var oneShot = ['notification','alarm','greeting','happy','surprised','telegram','vk','youtube'];
  if (oneShot.indexOf(state) >= 0) {
    danceTimer = setTimeout(function() {
      playState('idle');
    }, 4000);
  }
}

// Тап по модели — greeting
mv.addEventListener('click', function() {
  playState('greeting');
  try { AndroidBridge.onTap(); } catch(e) {}
});

// Ждём загрузки модели
mv.addEventListener('load', function() {
  try { AndroidBridge.onModelLoaded(); } catch(e) {}
  playState(currentState);
});

// Public API — те же методы что и у live2d_viewer
window.setAikaState = function(state) {
  playState(state || 'idle');
};
window.loadCustomModel = function(url) {
  mv.src = url;
};
window.switchModel = function(p) {
  mv.src = './' + p;
};
</script>
</body>
</html>
