<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; }
  model-viewer {
    width:100%; height:100%;
    background-color: transparent;
    --progress-bar-color: transparent;
    --progress-mask: transparent;
  }
</style>
</head>
<body>
<model-viewer
  id="mv"
  src="./models/aika_model.glb"
  autoplay
  animation-name="Idle"
  disable-zoom
  disable-pan
  touch-action="none"
  style="width:100%;height:100%;background:transparent"
  interaction-prompt="none"
></model-viewer>

<script>
var mv = document.getElementById('mv');
var currentState = 'idle';
var resetTimer = null;

// Маппинг состояний → анимации
// robot.glb:   Dance, Death, Idle, Jump, No, Punch, ThumbsUp, WalkForward, WaveHello, Yes
// xbot.glb:    agree, headShake, idle, run, sad_pose, sneak_pose, walk
// soldier.glb: Idle, Run, TPose, Walk
// aika_model.glb (robot): Dance, Death, Idle, Jump, No, Punch, ...

var ANIM_MAP = {
  // robot / aika_model
  idle:         ['Idle',       'idle',    'Survey'],
  listening:    ['Idle',       'idle'],
  thinking:     ['sneak_pose', 'No',      'Idle'],
  talking:      ['Yes',        'agree',   'Idle'],
  greeting:     ['WaveHello',  'agree',   'Walk'],
  dance:        ['Dance',      'SambaDance', 'Idle'],
  music:        ['Dance',      'SambaDance', 'Idle'],
  notification: ['Yes',        'agree',   'Jump'],
  alarm:        ['Jump',       'run',     'Run'],
  vk:           ['WalkForward','walk',    'Walk'],
  youtube:      ['WalkForward','walk',    'Walk'],
  telegram:     ['Yes',        'agree',   'Idle'],
  happy:        ['ThumbsUp',   'agree',   'Jump'],
  sad:          ['sad_pose',   'Death',   'Idle'],
  surprised:    ['Jump',       'Yes',     'Idle'],
  stretch:      ['sneak_pose', 'Idle'],
};

// Состояния которые сбрасываются к idle через N секунд
var ONE_SHOT = {
  greeting:4000, notification:4000, alarm:5000,
  happy:4000, surprised:3000, telegram:4000,
  vk:4000, youtube:4000
};

// Доступные анимации в текущей модели
var availableAnims = [];

mv.addEventListener('load', function() {
  // Собираем доступные анимации
  availableAnims = [];
  try {
    var anims = mv.availableAnimations;
    if (anims) availableAnims = Array.from(anims);
  } catch(e) {}
  try { AndroidBridge.onModelLoaded(); } catch(e) {}
  playState(currentState);
});

mv.addEventListener('click', function() {
  playState('greeting');
  try { AndroidBridge.onTap(); } catch(e) {}
});

function findAnim(state) {
  var candidates = ANIM_MAP[state] || ['Idle', 'idle'];
  for (var i = 0; i < candidates.length; i++) {
    if (availableAnims.indexOf(candidates[i]) >= 0) return candidates[i];
  }
  // Фолбэк — первая доступная
  return availableAnims[0] || 'Idle';
}

function playState(state) {
  clearTimeout(resetTimer);
  currentState = state;
  var anim = findAnim(state);
  try {
    mv.animationName = anim;
    mv.play({ repetitions: Infinity });
  } catch(e) {}
  // Авто-сброс
  if (ONE_SHOT[state]) {
    resetTimer = setTimeout(function() { playState('idle'); }, ONE_SHOT[state]);
  }
}

// Public API
window.setAikaState = function(state) { playState(state || 'idle'); };
window.loadCustomModel = function(url) { availableAnims = []; mv.src = url; };
window.switchModel = function(p) { availableAnims = []; mv.src = './' + p; };
</script>
</body>
</html>
