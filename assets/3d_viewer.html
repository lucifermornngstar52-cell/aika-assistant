<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<!-- Локальный model-viewer — работает без интернета -->
<script type="module" src="./model-viewer.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; }
  model-viewer {
    width:100%; height:100%;
    background-color: transparent;
    --progress-bar-color: transparent;
    --progress-mask: transparent;
  }
</style>
</head>
<body>
<model-viewer
  id="mv"
  src="./models/aika_model.glb"
  autoplay
  animation-name="Idle"
  disable-zoom
  disable-pan
  touch-action="none"
  style="width:100%;height:100%;background:transparent"
  interaction-prompt="none"
></model-viewer>

<script>
var mv = document.getElementById('mv');
var currentState = 'idle';
var resetTimer = null;

var ANIM_MAP = {
  idle:         ['idle',       'Idle',       'sneak_pose', 'Survey'],
  listening:    ['idle',       'Idle',       'sneak_pose'],
  thinking:     ['sneak_pose', 'No',         'headShake',  'Idle',  'idle'],
  talking:      ['agree',      'Yes',        'idle',       'Idle'],
  greeting:     ['Wave',       'agree',      'WaveHello',  'walk',  'Walk'],
  dance:        ['SambaDance', 'Dance',      'run',        'idle'],
  music:        ['SambaDance', 'Dance',      'run',        'idle'],
  notification: ['agree',      'Yes',        'Jump',       'idle'],
  alarm:        ['run',        'Run',        'Jump',       'idle'],
  vk:           ['walk',       'Walk',       'WalkForward','idle'],
  youtube:      ['walk',       'Walk',       'WalkForward','idle'],
  telegram:     ['agree',      'Yes',        'idle',       'Idle'],
  happy:        ['agree',      'ThumbsUp',   'SambaDance', 'idle'],
  sad:          ['sad_pose',   'Death',      'sneak_pose', 'idle'],
  surprised:    ['headShake',  'Jump',       'No',         'idle'],
  stretch:      ['sneak_pose', 'sad_pose',   'Idle',       'idle'],
};

var ONE_SHOT = {
  greeting:4000, notification:4000, alarm:5000,
  happy:4000, surprised:3000, telegram:4000,
  vk:4000, youtube:4000
};

var availableAnims = [];

function onModelLoaded() {
  availableAnims = [];
  try {
    var anims = mv.availableAnimations;
    if (anims) availableAnims = Array.from(anims);
  } catch(e) {}
  try { AndroidBridge.onModelLoaded(); } catch(e) {}
  // Уведомляем Flutter через JavaScriptHandler
  try { window.flutter_inappwebview.callHandler('FlutterChannel', 'modelLoaded'); } catch(e) {}
  playState(currentState);
}

mv.addEventListener('load', onModelLoaded);

mv.addEventListener('click', function() {
  playState('greeting');
  try { AndroidBridge.onTap(); } catch(e) {}
});

function findAnim(state) {
  var candidates = ANIM_MAP[state] || ['Idle', 'idle'];
  for (var i = 0; i < candidates.length; i++) {
    if (availableAnims.indexOf(candidates[i]) >= 0) return candidates[i];
  }
  return availableAnims[0] || 'Idle';
}

function playState(state) {
  clearTimeout(resetTimer);
  currentState = state;
  var anim = findAnim(state);
  try {
    mv.animationName = anim;
    mv.play({ repetitions: Infinity });
  } catch(e) {}
  if (ONE_SHOT[state]) {
    resetTimer = setTimeout(function() { playState('idle'); }, ONE_SHOT[state]);
  }
}

// Public API вызываемый из Flutter
window.setAikaState = function(state) { playState(state || 'idle'); };

window.loadCustomModel = function(url) {
  availableAnims = [];
  mv.src = '';
  setTimeout(function() { mv.src = url; }, 50);
};

window.switchModel = function(p) {
  availableAnims = [];
  var newSrc = './' + p;
  // Принудительный перезапуск: сбрасываем src в пустое и ставим новое
  mv.src = '';
  setTimeout(function() {
    mv.src = newSrc;
  }, 100);
};
</script>
</body>
</html>
