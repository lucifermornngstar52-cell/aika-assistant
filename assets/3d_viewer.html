<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  canvas { display:block; }
  #loading {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:rgba(255,255,255,0.8); font:16px Arial,sans-serif; text-align:center;
    pointer-events:none; z-index:10;
  }
  #err {
    position:fixed; top:10px; left:5px; right:5px;
    color:#ff6b6b; font:11px Arial,sans-serif; text-align:center;
    display:none; padding:8px; background:rgba(0,0,0,0.6); border-radius:8px;
    word-break:break-all; z-index:20;
  }
</style>
</head>
<body>
<div id="loading">✨</div>
<div id="err"></div>

<!-- UMD builds — работают с file:// в Android WebView -->
<script src="./three/three.min.js"></script>
<script src="./three/GLTFLoader.js"></script>

<script>
(function() {

  var renderer, scene, camera, mixer, clock;
  var currentAction = null;
  var availableAnims = {};
  var currentState   = 'idle';
  var resetTimer     = null;
  var breathT        = 0;
  var modelLoaded    = false;

  var ANIM_MAP = {
    idle:      ['idle','Idle','sneak_pose','Standing','mixamo.com'],
    listening: ['idle','Idle','sneak_pose'],
    thinking:  ['sneak_pose','No','headShake','idle','Idle'],
    talking:   ['agree','Yes','idle','Idle'],
    greeting:  ['agree','Wave','walk','idle'],
    dance:     ['SambaDance','Dance','run','idle'],
    music:     ['SambaDance','Dance','run','idle'],
    happy:     ['agree','ThumbsUp','SambaDance','idle'],
    sad:       ['sad_pose','sneak_pose','idle'],
    surprised: ['headShake','Jump','No','idle'],
    alarm:     ['run','Running','idle'],
    walk:      ['walk','Walking','run','idle'],
    notification: ['agree','Yes','idle'],
  };
  var ONE_SHOT = {greeting:4000,notification:3000,alarm:5000,happy:4000,surprised:3000,dance:8000,music:8000};

  function showErr(msg) {
    var el = document.getElementById('err');
    if (el) { el.style.display='block'; el.textContent = msg; }
  }

  function hideLoading() {
    var el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }

  function findAnim(state) {
    var names = ANIM_MAP[state] || ['idle','Idle'];
    for (var i=0; i<names.length; i++) {
      if (availableAnims[names[i]]) return availableAnims[names[i]];
    }
    var keys = Object.keys(availableAnims);
    return keys.length ? availableAnims[keys[0]] : null;
  }

  function playState(state) {
    clearTimeout(resetTimer);
    currentState = state;
    if (!mixer) return;
    var clip = findAnim(state);
    if (!clip) return;
    var action = mixer.clipAction(clip);
    if (currentAction && currentAction !== action) currentAction.fadeOut(0.3);
    action.reset().fadeIn(0.3).play();
    currentAction = action;
    if (ONE_SHOT[state]) {
      resetTimer = setTimeout(function(){ playState('idle'); }, ONE_SHOT[state]);
    }
  }

  function applyCelShading(model) {
    model.traverse(function(o) {
      if (!o.isMesh || !o.material) return;
      var mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(function(m) {
        if (m.roughness != null) m.roughness = Math.min(m.roughness, 0.65);
        if (m.metalness != null) m.metalness = Math.min(m.metalness, 0.1);
        if (m.color) {
          var h = {}; m.color.getHSL(h);
          m.color.setHSL(h.h, Math.min(h.s*1.35,1), h.l);
        }
      });
    });
  }

  function addOutline(model) {
    var mat = new THREE.MeshBasicMaterial({
      color:0x111111, side:THREE.BackSide, transparent:true, opacity:0.5
    });
    model.traverse(function(o) {
      if (!o.isMesh) return;
      var ol = new THREE.Mesh(o.geometry, mat);
      ol.scale.setScalar(1.025); ol.renderOrder = -1;
      o.add(ol);
    });
  }

  function loadModel(path) {
    // Очищаем предыдущую модель
    if (scene) {
      var toRemove = [];
      scene.children.forEach(function(c){ if(c.userData.char) toRemove.push(c); });
      toRemove.forEach(function(c){ scene.remove(c); });
    }
    if (mixer) { mixer.stopAllAction(); mixer = null; }
    availableAnims = {}; currentAction = null; modelLoaded = false;

    var loadEl = document.getElementById('loading');
    if (loadEl) { loadEl.style.display='block'; loadEl.textContent='✨'; }

    var loader = new THREE.GLTFLoader();
    loader.load(
      path,
      function(gltf) {
        var model = gltf.scene;
        model.userData.char = true;

        var box   = new THREE.Box3().setFromObject(model);
        var size  = box.getSize(new THREE.Vector3());
        var scale = 1.8 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);
        var center = box.getCenter(new THREE.Vector3());
        model.position.set(-center.x*scale, -box.min.y*scale, -center.z*scale);

        applyCelShading(model);
        addOutline(model);
        scene.add(model);

        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach(function(c){ availableAnims[c.name] = c; });
        }

        hideLoading();
        modelLoaded = true;

        try { AndroidBridge.onModelLoaded(); } catch(e) {}
        try { window.flutter_inappwebview.callHandler('FlutterChannel','modelLoaded'); } catch(e) {}

        playState(currentState);
      },
      undefined,
      function(err) {
        hideLoading();
        showErr('Load error: ' + (err.message || String(err)));
      }
    );
  }

  function init() {
    if (typeof THREE === 'undefined') {
      showErr('THREE.js не загружен');
      return;
    }
    if (typeof THREE.GLTFLoader === 'undefined') {
      showErr('GLTFLoader не загружен');
      return;
    }

    clock = new THREE.Clock();

    renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, premultipliedAlpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(28, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 3.5);
    camera.lookAt(0, 1.0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    var dir = new THREE.DirectionalLight(0xfff0e0, 2.0);
    dir.position.set(1,3,2); scene.add(dir);
    var rim = new THREE.DirectionalLight(0x88ccff, 1.5);
    rim.position.set(-1,2,-3); scene.add(rim);

    window.addEventListener('resize', function() {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    (function animate() {
      requestAnimationFrame(animate);
      var dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      breathT += dt * 0.7;
      if (scene) {
        scene.children.forEach(function(c) {
          if (c.userData.char) c.position.y += Math.sin(breathT) * 0.0003;
        });
      }
      renderer.render(scene, camera);
    })();

    // Глобальные функции для Flutter
    window.setAikaState = function(s) { playState(s || 'idle'); };
    window.switchModel  = function(p) {
      if (!p) return;
      loadModel(p.startsWith('.') ? p : './' + p);
    };
    window.loadCustomModel = function(p) { loadModel(p); };

    // Загружаем дефолтную модель
    loadModel('./models/anime_girl.glb');
  }

  // Запускаем после загрузки страницы
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
