<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:transparent !important; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; background:transparent; }
  #loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:14px; font-family:sans-serif; text-shadow:0 0 4px #000; z-index:10; }
  #debug { position:absolute; top:4px; left:4px; color:#0f0; font-size:10px; font-family:monospace; z-index:10; max-width:90%; word-break:break-all; }
</style>
</head>
<body>
<div id="loading">Loading 3D...</div>
<div id="debug"></div>
<canvas id="canvas"></canvas>
<script type="module">
import * as THREE from './three/three.module.min.js';
import { GLTFLoader } from './three/GLTFLoader.js';

const canvas = document.getElementById('canvas');
const loadingEl = document.getElementById('loading');
const debugEl = document.getElementById('debug');

function dbg(msg) {
  debugEl.textContent = msg;
  console.log('[3D]', msg);
}

let scene, camera, renderer, mixer, model, clock;
let currentAnim = 'idle';
let animations = [];
let autoRotate = false;

function init() {
  dbg('init()');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(30, 1, 0.1, 1000);
  camera.position.set(0, 1.2, 3.5);
  camera.lookAt(0, 1.0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(2, 5, 3);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dir2.position.set(-2, 3, -3);
  scene.add(dir2);

  clock = new THREE.Clock();

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);
  dbg('init done, starting animate');
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (autoRotate && model) model.rotation.y += dt * 0.5;
  renderer.render(scene, camera);
}

function loadModel(url) {
  dbg('loadModel: ' + url);
  loadingEl.style.display = 'block';
  loadingEl.textContent = 'Loading 3D...';
  const loader = new GLTFLoader();
  loader.load(url, function(gltf) {
    dbg('Model loaded! Meshes: ' + gltf.scene.children.length);
    model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.0 / maxDim;
    model.scale.setScalar(scale);
    model.position.x = -center.x * scale;
    model.position.y = -center.y * scale + 1.0;
    model.position.z = -center.z * scale;
    scene.add(model);

    animations = gltf.animations || [];
    dbg('Animations: ' + animations.map(a => a.name).join(', '));
    if (animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      playAnim(currentAnim);
    }

    loadingEl.style.display = 'none';
    dbg('Model ready!');
    try { window.flutter_inappwebview.callHandler('onModelLoaded', { success: true, animCount: animations.length }); } catch(e) {}
  }, function(progress) {
    if (progress.total) {
      const pct = Math.round(progress.loaded / progress.total * 100);
      loadingEl.textContent = 'Loading ' + pct + '%';
      if (pct % 25 === 0) dbg('Progress: ' + pct + '%');
    }
  }, function(error) {
    dbg('ERROR: ' + String(error).substring(0, 200));
    loadingEl.textContent = 'Load error';
    loadingEl.style.color = '#f44';
    try { window.flutter_inappwebview.callHandler('onModelError', { error: String(error) }); } catch(e) {}
  });
}

function playAnim(name) {
  currentAnim = name;
  if (!mixer || animations.length === 0) return;
  let clip = animations.find(a => a.name === name);
  if (!clip) clip = animations.find(a => a.name.toLowerCase() === name.toLowerCase());
  if (!clip) clip = animations.find(a => a.name.toLowerCase().includes(name.toLowerCase()));
  if (clip) {
    mixer.stopAllAction();
    mixer.clipAction(clip).reset().setLoop(THREE.LoopRepeat, Infinity).play();
    dbg('Playing: ' + clip.name);
  }
}

function setState(state) {
  const map = {
    'idle': 'idle', 'listening': 'idle', 'thinking': 'sneak_pose',
    'talking': 'idle', 'greeting': 'agree', 'dance': 'SambaDance',
    'happy': 'agree', 'sad': 'sad_pose', 'angry': 'headShake',
    'walk': 'walk', 'run': 'run', 'agree': 'agree', 'headShake': 'headShake',
  };
  playAnim(map[state] || 'idle');
}

function setAutoRotate(val) { autoRotate = val; }

window.model3D = { loadModel, playAnim, setState, setAutoRotate,
  getAnimations: () => animations.map(a => a.name) };

window.addEventListener('flutterInAppWebViewPlatformReady', function() {
  dbg('Platform ready');
  try { window.flutter_inappwebview.callHandler('onReady', {}); } catch(e) { dbg('onReady call failed: ' + e); }
});

try {
  init();
} catch(e) {
  dbg('Init error: ' + e.message);
  loadingEl.textContent = 'Error: ' + e.message;
  loadingEl.style.color = '#f44';
  try { window.flutter_inappwebview.callHandler('onModelError', { error: String(e) }); } catch(e2) {}
}
</script>
</body>
</html>
