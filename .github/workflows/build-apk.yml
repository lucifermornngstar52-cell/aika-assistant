name: Build APK

on:
  push:
    branches: [ main, feature/voice-background-listening ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Flutter 3.24.x ships with Dart 3.5 — required by flutter_inappwebview >=6.1.0
      - name: Setup Flutter 3.24.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # Fix: speech_to_text ≤7.x uses flutter.compileSdkVersion inside android{}
      # which AGP 8 removed. Two-layer fix:
      # 1) Gradle init script that provides flutter.* properties to all library modules
      # 2) Direct file patch (exclude example/ to find the real plugin build.gradle)
      - name: Fix speech_to_text AGP 8 incompatibility
        run: |
          # ── Layer 1: Gradle init script (most reliable) ───────────────────
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/flutter-compat.gradle" << 'GRADLE'
          // Provides flutter.* properties to library plugins that reference them
          // Required for speech_to_text ≤7.x with AGP ≥8
          allprojects {
              plugins.withId('com.android.library') {
                  android.buildFeatures.buildConfig = false
              }
              afterEvaluate { proj ->
                  if (proj.plugins.hasPlugin('com.android.library')) {
                      if (!proj.android.extensions.findByName('flutter')) {
                          proj.android.extensions.extraProperties['flutter'] = [
                              compileSdkVersion: 34,
                              targetSdkVersion: 34,
                              minSdkVersion: 21,
                              ndkVersion: '25.1.8937393',
                              javaVersion: JavaVersion.VERSION_11,
                          ]
                      }
                  }
              }
          }
          GRADLE
          echo "✅ Gradle init script created"
          cat "$HOME/.gradle/init.d/flutter-compat.gradle"

          # ── Layer 2: Direct file patch (exclude example/ dirs) ───────────
          # Find speech_to_text plugin build.gradle — NOT the example project one
          STT_GRADLE=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/speech_to_text-*/android/build.gradle" \
            ! -path "*/example/*" \
            -maxdepth 5 2>/dev/null | head -1)

          if [ -z "$STT_GRADLE" ]; then
            echo "⚠️ speech_to_text build.gradle not found — relying on init script"
          else
            echo "📝 Found: $STT_GRADLE"
            echo "=== Full file (with line numbers) ==="
            cat -n "$STT_GRADLE"
            echo ""

            # Use node for reliable regex replacement
            node - "$STT_GRADLE" << 'JSEOF'
          const fs = require('fs');
          const file = process.argv[1];
          let src = fs.readFileSync(file, 'utf8');
          const before = src;
          src = src
            .replace(/flutter\.compileSdkVersion/g, '34')
            .replace(/flutter\.targetSdkVersion/g,  '34')
            .replace(/flutter\.minSdkVersion/g,      '21')
            .replace(/flutter\.ndkVersion/g,         '"25.1.8937393"')
            .replace(/flutter\.javaVersion/g,        'JavaVersion.VERSION_11');
          fs.writeFileSync(file, src);
          const changed = src !== before;
          console.log(changed ? '✅ flutter.* references replaced' : 'ℹ️  No flutter.* references found (init script will handle it)');
          console.log('=== After patch ===');
          console.log(src);
          JSEOF
          fi

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: flutter build apk --release --split-per-abi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      - name: List built APKs
        if: always()
        run: |
          echo "=== Build outputs ==="
          find build/app/outputs -name "*.apk" 2>/dev/null \
            | while read f; do echo "  $(du -h "$f" | cut -f1)  $(basename "$f")"; done \
            || echo "No APKs found"

      - name: Upload arm64-v8a Release APK
        if: success() && github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload armeabi-v7a Release APK
        if: success() && github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-armeabi-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload x86_64 Release APK
        if: success() && github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-x86_64-release
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK
        if: success() && github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Comment on PR with APK link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ok
                ? `## ✅ APK собран\n\n📦 [Скачать APK](${url}) — 30 дней\n\n| Файл | Устройство |\n|---|---|\n| arm64-v8a | Все современные телефоны |\n| armeabi-v7a | Старые устройства |`
                : `## ❌ Ошибка сборки\n\n[Посмотреть логи](${url})`
            });
