name: Build APK

on:
  push:
    branches: [ main, feature/voice-background-listening ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify code generation (if needed)
        run: |
          if [ -f "pubspec.yaml" ] && grep -q "build_runner" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs || true
          fi

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --no-shrink \
            -v

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug -v

      - name: Upload Release APK (arm64)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK (armeabi-v7a)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-armeabi-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Universal APK (fallback)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Show APK size info
        run: |
          echo "=== Build artifacts ==="
          find build/app/outputs/flutter-apk/ -name "*.apk" 2>/dev/null \
            | while read f; do
                size=$(du -h "$f" | cut -f1)
                echo "  $size  $(basename $f)"
              done || echo "No APKs found"

      - name: Comment PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ APK собран\n\n📦 Скачать APK: [artifacts](${run_url})\n\n> _Доступно 30 дней_`
            });
