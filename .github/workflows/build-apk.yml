name: Build APK

on:
  push:
    branches: [ main, feature/voice-background-listening ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  FLUTTER_VERSION: '3.22.3'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Patch speech_to_text Gradle incompatibility
        # speech_to_text ≤7.4.x accesses android.flutter in LibraryExtension,
        # which AGP ≥8 removed. Patch: make that block a no-op.
        run: |
          STT_GRADLE="$HOME/.pub-cache/hosted/pub.dev/speech_to_text-7.4.0/android/build.gradle"
          if [ -f "$STT_GRADLE" ]; then
            echo "Patching $STT_GRADLE"
            # Replace `android { ... flutter { ... } ... }` with no-op
            # Safer: just comment out the problematic block
            sed -i 's/android\.flutter\.buildMode/\/* android.flutter.buildMode *\/ "release"/' "$STT_GRADLE" || true
            sed -i '/android\.flutter\./d' "$STT_GRADLE" || true
            echo "Patch applied to speech_to_text build.gradle"
            head -30 "$STT_GRADLE"
          else
            echo "speech_to_text build.gradle not found at expected path:"
            find "$HOME/.pub-cache" -name "build.gradle" -path "*/speech_to_text*" 2>/dev/null | head -5
          fi

      - name: Analyze code (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            -v 2>&1 | tail -60

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: flutter build apk --debug -v 2>&1 | tail -60

      - name: List built APKs
        run: |
          echo "=== Built APKs ==="
          find build/app/outputs -name "*.apk" 2>/dev/null \
            | while read f; do echo "  $(du -h "$f" | cut -f1)  $(basename $f)"; done \
            || echo "No APKs found"

      - name: Upload arm64 Release APK
        if: ${{ github.event.inputs.build_type != 'debug' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload armeabi Release APK
        if: ${{ github.event.inputs.build_type != 'debug' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-armeabi-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: aika-assistant-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Comment PR with APK link
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ APK собран\n\n📦 [Скачать APK (30 дней)](${run_url})\n\n| Архитектура | Файл |\n|---|---|\n| arm64 (современные) | app-arm64-v8a-release.apk |\n| armeabi (старые) | app-armeabi-v7a-release.apk |`
            });
